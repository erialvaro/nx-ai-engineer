name: release
# Publish to PyPI on a version tag (e.g. v1.0.0) and create a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Quality Gate must pass before any release
        run: python scripts/quality_gate.py
      - name: Tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re,sys; print(re.search(r'version\\s*=\\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          test "$TAG" = "$VER" || { echo "tag $TAG != version $VER"; exit 1; }

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build all distributions
        run: |
          set -e
          mkdir -p dist_all
          python -m build . --outdir dist_all
          for pkg in packages/nx-*; do python -m build "$pkg" --outdir dist_all; done
          python -m twine check dist_all/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist_all/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist_all/*
