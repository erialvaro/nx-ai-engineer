name: release
# Publish the single self-contained `nx-ai-engineer` distribution to PyPI on a
# version tag (e.g. v1.0.1) and create a GitHub Release. The one wheel bundles
# every nx_* module — there are no sub-distributions to publish. Uses PyPI
# Trusted Publishing (OIDC) by default — no secrets. If a `PYPI_API_TOKEN` secret
# is set, it is used instead (token fallback).
on:
  push:
    tags: ["v*"]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Quality Gate must pass before any release
        run: python scripts/quality_gate.py
      - name: Tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re; print(re.search(r'version\\s*=\\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          test "$TAG" = "$VER" || { echo "tag $TAG != version $VER"; exit 1; }

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build the single self-contained sdist + wheel (bundles all nx_* modules)
        run: |
          set -e
          python -m pip install --upgrade build twine
          python -m build . --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # add deployment protection rules here if desired
    permissions:
      id-token: write          # OIDC — PyPI Trusted Publishing (no token needed)
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # Empty when no secret is set -> the action uses Trusted Publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
