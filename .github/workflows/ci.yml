name: ci
on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # stdlib-only: no runtime dependencies to install.
      - name: Quality Gate (tests, cycles, unused-imports, CLI, API, docs)
        run: python scripts/quality_gate.py

  package-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Verify acyclic package dependencies
        run: python scripts/verify_packages.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build every package (sdist + wheel)
        run: |
          set -e
          python -m build .
          for pkg in packages/nx-*; do
            echo "::group::build $pkg"
            python -m build "$pkg"
            echo "::endgroup::"
          done
      - name: Smoke-test the installed CLI
        run: |
          python -m pip install packages/nx-core packages/nx-workflow packages/nx-sdk \
            packages/nx-providers packages/nx-obsidian packages/nx-knowledge \
            packages/nx-runtime packages/nx-cli packages/nx-packs
          nxai version
