[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-workflow"
version = "1.0.0"
description = "Reusable execution pipelines (Workflow/Step/Registry + builtins)."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["nx-core==1.0.0"]

[tool.setuptools.packages.find]
include = ["nx_workflow*"]
