[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-providers"
version = "1.0.0"
description = "Knowledge Providers: filesystem, git, markdown, adr, project-brain (+ base/registry)."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["nx-core==1.0.0"]

[tool.setuptools.packages.find]
include = ["nx_providers*"]
