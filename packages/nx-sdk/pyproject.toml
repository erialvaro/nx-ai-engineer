[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-sdk"
version = "1.0.0"
description = "Public extension surface: register Agents/Engines/Workflows/Adapters/Plugins/Tools."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["nx-core==1.0.0", "nx-workflow==1.0.0"]

[tool.setuptools.packages.find]
include = ["nx_sdk*"]
