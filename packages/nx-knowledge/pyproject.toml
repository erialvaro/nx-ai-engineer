[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nxai-knowledge"
version = "2.1.0"
description = "Knowledge Engine + Graph, Memory (Brain/Context/Learning/Semantic), Autonomous Learning + Project Evolution."
requires-python = ">=3.8"
license = { text = "MIT" }
readme = { text = "Part of **NX AI Engineer** — a stdlib-only Developer Infrastructure Platform for AI-assisted software development. See https://github.com/erialvaro/nx-ai-engineer", content-type = "text/markdown" }
authors = [{ name = "NX AI Engineer" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["nxai-core==2.1.0", "nxai-providers==2.1.0", "nxai-obsidian==2.1.0"]

[project.urls]
Homepage = "https://github.com/erialvaro/nx-ai-engineer"
Repository = "https://github.com/erialvaro/nx-ai-engineer"

[tool.setuptools.packages.find]
include = ["nx_knowledge*"]
