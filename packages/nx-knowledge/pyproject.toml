[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-knowledge"
version = "1.0.0"
description = "Knowledge Engine + Graph, Memory (Brain/Context/Learning/Semantic), Autonomous Learning + Project Evolution."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["nx-core==1.0.0", "nx-providers==1.0.0", "nx-obsidian==1.0.0"]

[tool.setuptools.packages.find]
include = ["nx_knowledge*"]
