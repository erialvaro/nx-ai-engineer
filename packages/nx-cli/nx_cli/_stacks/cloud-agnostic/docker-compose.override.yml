# Local development overlay (auto-applied by `docker compose` / `make up`).
# Hot reload + bind mounts + verbose logs. NOT used in production.
services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: ["npm", "run", "dev"]
