[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-obsidian"
version = "1.0.0"
description = "Obsidian knowledge: provider (reader) + ObsidianSync (visual vault, incremental)."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["nx-core==1.0.0", "nx-providers==1.0.0"]

[tool.setuptools.packages.find]
include = ["nx_obsidian*"]
