[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nxai-core"
version = "2.1.1"
description = "Pure primitives: domain, states(9), lifecycle, BaseEngine(Dry->Test->Execute), governance, observability, experience, agents/util/config."
requires-python = ">=3.8"
license = { text = "MIT" }
readme = { text = "Part of **NX AI Engineer** — a stdlib-only Developer Infrastructure Platform for AI-assisted software development. See https://github.com/erialvaro/nx-ai-engineer", content-type = "text/markdown" }
authors = [{ name = "NX AI Engineer" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/erialvaro/nx-ai-engineer"
Repository = "https://github.com/erialvaro/nx-ai-engineer"

[tool.setuptools.packages.find]
include = ["nx_core*"]
