[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-core"
version = "1.0.0"
description = "Pure primitives: domain, states(9), lifecycle, BaseEngine(Dry->Test->Execute), governance, observability, experience, agents/util/config."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["nx_core*"]
